name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install Caddy v2.11.7
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/caddyserver/caddy/releases/download/v2.11.7
          archive=caddy_2.11.7_linux_amd64.tar.gz
          curl -fsSLO "$release/$archive"
          curl -fsSLO "$release/caddy_2.11.7_checksums.txt"
          awk -v archive="$archive" '$2 == archive' caddy_2.11.7_checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum -c selected-checksum.txt
          mkdir -p "$RUNNER_TEMP/caddy-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/caddy-bin" caddy
          echo "$RUNNER_TEMP/caddy-bin" >> "$GITHUB_PATH"
      - name: Go validation and native Caddy acceptance
        run: scripts/check --integration
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-coverage
          path: .sandbox/check/coverage.out
          include-hidden-files: true
          if-no-files-found: ignore
